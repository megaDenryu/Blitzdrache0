[package]
name = "blitz_render"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

# ワークスペース内で ash に依存してよいのはこのクレートだけ。
# unsafe な Vulkan 呼び出しはこのクレートの実装内部に封じ込め、
# 公開APIからは ash の型を一切露出しない。
[dependencies]
ash = { workspace = true }
ash-window = { workspace = true }
raw-window-handle = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
# 数学DDDのフレーム型を公開APIで受け、生値への変換(GPU境界)をこのクレート内部で行うため。
blitz_math = { path = "../blitz_math" }
