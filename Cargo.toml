[workspace]
resolver = "3"
members = [
    "crates/blitz_math",
    "crates/blitz_render",
    "crates/blitz_engine",
    "crates/blitz_assembly",
    "crates/blitz_asset_compiler",
    "crates/blitz_sim",
    "crates/blitz_game",
    "crates/blitz_app",
    "crates/editor_server",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

# 参照: CLAUDE.md「機械的強制」。緩和する変更は禁止（テストモジュールでの局所allowのみ可）
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
as_conversions = "deny"

# 依存はワークスペースで一元管理し、各クレートは workspace = true で参照する。
# どの層がどの外部依存に触れるかを Cargo.toml の差分だけで監査できるようにするため。
[workspace.dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
raw-window-handle = "0.6"
glam = "0.30"
thiserror = "2"
# 参照: README「利用ライブラリ」gltf/image の採用審査(M3)。imageは機能を絞って依存を軽くする
# gltfのextrasは部品の接合点をglTFのextrasから読むために要る。既定に入っておらず、無いとextrasが空の型別名になる
# (参照: `_doc/設計/部品カタログと接合点.md`「実地で確かめた事実」)。機能一覧はconformの機能台帳が検査する
gltf = { version = "1", features = ["extras"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 参照: README「利用ライブラリ」serde_json の採用審査。接合点のextrasを解くためだけの依存であり、
# gltf-jsonが無条件で引いているため依存の木に増えるものは無い。blitz_asset_compilerのみが依存する
serde_json = { version = "1", features = ["raw_value"] }
# 参照: README「利用ライブラリ」rayon の採用審査。チャンクごとに独立な生成の並列化専用、blitz_asset_compilerのみが依存
rayon = "1"
# 参照: README「利用ライブラリ」egui/egui-winit の採用審査(M5)。開発用UI専用、blitz_appのみが依存
egui = "0.31"
egui-winit = { version = "0.31", default-features = false }
# 参照: README「利用ライブラリ」crossterm の採用審査。`cargo xtask menu`の矢印キー入力専用、xtaskのみが依存
crossterm = "0.28"
# 参照: README「利用ライブラリ」editor_server(ゲーム開発用エディター段1)の採用審査。
# serde/axum/tokio/tower/tower-http/ts-rsはeditor_serverのみが依存する
serde = { version = "1", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
ts-rs = "12"

[profile.dev]
# シェーダー・アセット処理はデバッグビルドでも最適化がないと遅すぎるため、依存クレートのみ最適化
[profile.dev.package."*"]
opt-level = 2
