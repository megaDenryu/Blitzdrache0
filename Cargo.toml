[workspace]
resolver = "3"
members = [
    "crates/blitz_render",
    "crates/blitz_engine",
    "crates/blitz_app",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

# 依存はワークスペースで一元管理し、各クレートは workspace = true で参照する。
# どの層がどの外部依存に触れるかを Cargo.toml の差分だけで監査できるようにするため。
[workspace.dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
raw-window-handle = "0.6"
glam = "0.30"
thiserror = "2"

[profile.dev]
# シェーダー・アセット処理はデバッグビルドでも最適化がないと遅すぎるため、依存クレートのみ最適化
[profile.dev.package."*"]
opt-level = 2
