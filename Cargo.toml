[workspace]
resolver = "3"
members = [
    "crates/blitz_math",
    "crates/blitz_render",
    "crates/blitz_engine",
    "crates/blitz_app",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

# 参照: CLAUDE.md「機械的強制」。緩和する変更は禁止（テストモジュールでの局所allowのみ可）
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
as_conversions = "deny"

# 依存はワークスペースで一元管理し、各クレートは workspace = true で参照する。
# どの層がどの外部依存に触れるかを Cargo.toml の差分だけで監査できるようにするため。
[workspace.dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
raw-window-handle = "0.6"
glam = "0.30"
thiserror = "2"
# 参照: README「利用ライブラリ」gltf/image の採用審査(M3)。imageは機能を絞って依存を軽くする
gltf = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 参照: README「利用ライブラリ」egui/egui-winit の採用審査(M5)。開発用UI専用、blitz_appのみが依存
egui = "0.31"
egui-winit = { version = "0.31", default-features = false }

[profile.dev]
# シェーダー・アセット処理はデバッグビルドでも最適化がないと遅すぎるため、依存クレートのみ最適化
[profile.dev.package."*"]
opt-level = 2
